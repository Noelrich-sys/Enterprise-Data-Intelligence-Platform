services:

  postgres:

    image: postgres:16

    container_name: edip-postgres

    environment:
      POSTGRES_USER: edip
      POSTGRES_PASSWORD: password
      POSTGRES_DB: edip

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  localstack:

    image: localstack/localstack:3.8

    container_name: edip-localstack

    environment:
      SERVICES: s3
      DEBUG: 1
      DATA_DIR: /tmp/localstack/data

    ports:
      - "4566:4566"

    volumes:
      - "./docker/localstack:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"


volumes:

  postgres_data: